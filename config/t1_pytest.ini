[pytest]
minversion = 8.0
addopts = --strict-markers --timeout=30 --timeout-method=thread
markers =
    unit: isolated deterministic tests with no external simulator or benchmark
    slow: bounded tests intentionally outside the default inner loop
    benchmark: deterministic synthetic or PyBullet evaluation tests
    live: tests requiring FlightSim, hardware, or another external live service
timeout_func_only = false
