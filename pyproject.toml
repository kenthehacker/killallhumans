[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--timeout=30",
    "--timeout-method=thread",
    "-m",
    "not slow and not benchmark and not live",
]
markers = [
    "unit: isolated deterministic tests with no external simulator or benchmark",
    "slow: bounded tests that are intentionally outside the default inner loop",
    "benchmark: deterministic synthetic or PyBullet evaluation tests",
    "live: tests that require FlightSim, hardware, or another external live service",
]
required_plugins = ["pytest-timeout==2.4.0"]
timeout_func_only = false
